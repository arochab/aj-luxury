name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "candidate/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: preproduction
      PREPROD_TARGET_PROJECT_ID: appgprj_6a7d223ffdec8191b360551446150216
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
