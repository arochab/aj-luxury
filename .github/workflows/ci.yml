name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "candidate/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Resolve governed build target
        shell: bash
        run: |
          target_project_id="$(node -e "const fs=require('node:fs'); const hosting=JSON.parse(fs.readFileSync('.openai/hosting.json','utf8')); process.stdout.write(hosting.project_id)")"
          if [[ "$target_project_id" == "appgprj_6a81995167048191b50b37833695f3dc" || "$target_project_id" == "appgprj_6a63835f347c819187cdbb7ee16641cc" ]]; then
            echo "APP_ENV=production" >> "$GITHUB_ENV"
            echo "PREPROD_TARGET_PROJECT_ID=" >> "$GITHUB_ENV"
          else
            echo "APP_ENV=preproduction" >> "$GITHUB_ENV"
            echo "PREPROD_TARGET_PROJECT_ID=appgprj_6a7d223ffdec8191b360551446150216" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
